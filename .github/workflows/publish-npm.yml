name: Publish npm packages

on:
  push:
    tags: ['sdk-v*']

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @konfiqo/storefront-sdk and -react
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; only commits on main are published"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag must equal both package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#sdk-v}"
          sdk="$(node -p "require('./packages/sdk/package.json').version")"
          react="$(node -p "require('./packages/react/package.json').version")"
          if [ "$version" != "$sdk" ] || [ "$version" != "$react" ]; then
            echo "::error::tag $TAG does not match sdk $sdk and react $react"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build -w packages/sdk
      - run: npm run build -w packages/react
      - name: Publish @konfiqo/storefront-sdk
        run: npm publish --provenance --access public -w packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @konfiqo/storefront-react
        run: npm publish --provenance --access public -w packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
